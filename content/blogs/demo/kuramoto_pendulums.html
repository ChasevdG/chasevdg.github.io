<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kuramoto Pendulums — Huygens Synchronization</title>
<link rel="stylesheet" href="demo-shared.css">
<style>
  :root {
    --bg: transparent;
    --panel: #ffffff;
    --border: rgba(0,0,0,0.12);
    --border-strong: rgba(0,0,0,0.25);
    --surface-1: #f5f4ee;
    --text: #1a1a18;
    --muted: #5f5e5a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1a18;
      --panel: #262624;
      --border: rgba(255,255,255,0.14);
      --border-strong: rgba(255,255,255,0.3);
      --surface-1: #262624;
      --text: #f0efea;
      --muted: #b4b2a9;
    }
  }
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    margin: 0;
    padding: 16px 20px;
    background: var(--bg);
    color: var(--text);
  }
  p.lead { color: var(--muted); margin: 0 0 16px 0; font-size: 13px; }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px;
  }
  .controls { margin-bottom: 14px; }
  .row {
    display: grid;
    grid-template-columns: 80px 1fr 56px;
    gap: 10px;
    align-items: center;
    margin-bottom: 8px;
  }
  .row label { font-size: 13px; }
  .row .val {
    font-size: 12px;
    color: var(--muted);
    text-align: right;
    font-variant-numeric: tabular-nums;
  }
  input[type="range"] { width: 100%; accent-color: #F5A800; }
  .statusbar {
    display: flex;
    align-items: baseline;
    gap: 12px;
    font-size: 12px;
    color: var(--muted);
    margin-top: 4px;
  }
  .statusbar button {
    font-size: 12px;
    padding: 4px 12px;
    border: 1px solid var(--border-strong);
    border-radius: 4px;
    background: transparent;
    color: var(--text);
    cursor: pointer;
  }
  .statusbar .spacer { margin-left: auto; }
  .statusbar button:hover { background: var(--surface-1); }
  .statusbar button:active { transform: scale(0.98); }
  .mode-btn {
    flex: 1;
    padding: 6px 8px;
    font-size: 13px;
    border: 1px solid var(--border-strong);
    border-radius: 4px;
    background: transparent;
    color: var(--text);
    cursor: pointer;
  }
  .mode-btn:hover { background: var(--surface-1); }
  .mode-btn.active {
    background: #F5A800;
    color: #1a1a18;
    border-color: #F5A800;
    font-weight: 500;
  }
  .mode-btn.active:hover { background: #F5A800; }
  .mode-btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .canvas-wrap {
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    background: var(--panel);
  }
  canvas { display: block; width: 100%; }
</style>
</head>
<body>
<div class="subtab-about-header" style="text-align: center;">
<h1>Huygen Pendulums</h1>
</div>
<div class="panel">
  <div class="controls">
    <div class="row">
      <label>View</label>
      <div style="display:flex;gap:6px;">
        <button id="viewPend" class="mode-btn active">Pendulums</button>
        <button id="viewSpring" class="mode-btn">Block Springs</button>
      </div>
      <span class="val"></span>
    </div>
    <div class="row" id="nnRow">
      <label for="nn">Pendulums</label>
      <input type="range" id="nn" min="2" max="12" step="1" value="2">
      <span class="val" id="nn-out">2</span>
    </div>
    <div class="row">
      <label for="kk">K</label>
      <input type="range" id="kk" min="0" max="3" step="0.05" value="0">
      <span class="val" id="kk-out">0.00</span>
    </div>
    <div class="row">
      <label for="dw">&Delta;&omega;</label>
      <input type="range" id="dw" min="0" max="2" step="0.05" value="0.5">
      <span class="val" id="dw-out">0.50</span>
    </div>
    <div class="row">
      <label for="spd">Speed</label>
      <input type="range" id="spd" min="0.25" max="3" step="0.25" value="1">
      <span class="val" id="spd-out">1.0&times;</span>
    </div>
    <div class="statusbar">
      <span id="regime">Uncoupled: each pendulum keeps its own beat</span>
      <span class="spacer" id="order">r = 0.00</span>
      <button id="reset">Reset</button>
      <button id="pause">Pause</button>
    </div>
  </div>
  <div class="canvas-wrap">
    <canvas id="cv"></canvas>
  </div>
</div>

<script>
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const W = 900, H = 430, DPR = window.devicePixelRatio || 1;
cv.width = W * DPR; cv.height = H * DPR;
ctx.scale(DPR, DPR);

const W0 = 1.2;
let N = 2, K = 0, dOm = 0.5, speed = 1, paused = false;

const mq = window.matchMedia('(prefers-color-scheme: dark)');
let dark = mq.matches;
let beamCol, tickCol, axisCol, dispCol;
function setColors(){
  dark = mq.matches;
  beamCol = dark ? '#cfd4dc' : '#2b3442';
  tickCol = dark ? 'rgba(207,212,220,0.75)' : 'rgba(43,52,66,0.75)';
  axisCol = dark ? 'rgba(160,160,155,0.4)' : 'rgba(95,94,90,0.35)';
  dispCol = dark ? '#63b3ff' : '#2f6df0';
}
setColors();
if (mq.addEventListener) mq.addEventListener('change', setColors);

const rodCol = '#E8912D';
const bobCol = '#C87820';
const meanCol = '#F5A800';

let TH, OM;
function init(){
  TH = new Float64Array(N);
  OM = new Float64Array(N);
  for (let j = 0; j < N; j++){
    OM[j] = N === 1 ? W0 : W0 - dOm/2 + dOm * j / (N - 1);
    TH[j] = Math.random() * 6.2832;
  }
}
function setFreqs(){
  for (let j = 0; j < N; j++)
    OM[j] = N === 1 ? W0 : W0 - dOm/2 + dOm * j / (N - 1);
}

function meanField(th){
  let cx = 0, sy_ = 0;
  for (let j = 0; j < N; j++){ cx += Math.cos(th[j]); sy_ += Math.sin(th[j]); }
  cx /= N; sy_ /= N;
  return [Math.hypot(cx, sy_), Math.atan2(sy_, cx)];
}

const dth = new Float64Array(12), tmp = new Float64Array(12);
function deriv(th, out){
  const [r, psi] = meanField(th);
  for (let j = 0; j < N; j++)
    out[j] = OM[j] + K * r * Math.sin(psi - th[j]);
}
function integrate(dt){
  deriv(TH, dth);
  for (let j = 0; j < N; j++) tmp[j] = TH[j] + dth[j]*dt*0.5;
  deriv(tmp, dth);
  for (let j = 0; j < N; j++) TH[j] += dth[j]*dt;
}

const BEAM_Y = 46, ROD_L = 300, AMP = 0.42;

function draw(){
  ctx.clearRect(0, 0, W, H);

  const [r, psi] = meanField(TH);

  let msin = 0;
  for (let j = 0; j < N; j++) msin += Math.sin(TH[j]);
  msin /= N;
  const kFrac = Math.min(1, K / 3);
  const bx = 20 * kFrac * msin;

  const m = 110;
  const anchors = [];
  for (let j = 0; j < N; j++){
    const t = N === 1 ? 0.5 : j / (N - 1);
    anchors.push(m + t * (W - 2*m) + bx);
  }

  for (let j = 0; j < N; j++){
    const phi = AMP * Math.sin(TH[j]);
    const ax = anchors[j], ay = BEAM_Y;
    const ex = ax + ROD_L * Math.sin(phi);
    const ey = ay + ROD_L * Math.cos(phi);

    ctx.strokeStyle = rodCol;
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.moveTo(ax, ay);
    ctx.lineTo(ex, ey);
    ctx.stroke();

    ctx.fillStyle = bobCol;
    ctx.beginPath();
    ctx.arc(ex, ey, 14, 0, 6.2832);
    ctx.fill();
  }

  const boardWidth = K === 0 ? 6 : 18 - 14 * kFrac;

  ctx.strokeStyle = beamCol;
  ctx.lineWidth = boardWidth;
  ctx.lineCap = 'round';
  if (K === 0) ctx.setLineDash([1, 16]);
  ctx.beginPath();
  ctx.moveTo(m - 40 + bx, BEAM_Y);
  ctx.lineTo(W - m + 40 + bx, BEAM_Y);
  ctx.stroke();
  ctx.setLineDash([]);

  const centerX = W / 2;

  ctx.fillStyle = meanCol;
  ctx.beginPath();
  ctx.arc(centerX, BEAM_Y, 7, 0, 6.2832);
  ctx.fill();

  ctx.fillStyle = dispCol;
  ctx.beginPath();
  ctx.arc(centerX + bx, BEAM_Y, 7, 0, 6.2832);
  ctx.fill();

  const ir = 44, icx = W - 64, icy = H - 64;
  ctx.strokeStyle = axisCol;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(icx, icy, ir, 0, 6.2832);
  ctx.stroke();
  ctx.strokeStyle = meanCol;
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(icx, icy);
  ctx.lineTo(icx + ir * r * Math.cos(psi), icy - ir * r * Math.sin(psi));
  ctx.stroke();
  for (let j = 0; j < N; j++){
    ctx.fillStyle = rodCol;
    ctx.beginPath();
    ctx.arc(icx + ir * Math.cos(TH[j]), icy - ir * Math.sin(TH[j]), 4, 0, 6.2832);
    ctx.fill();
  }

  return r;
}

// =========================================================================
// Alternate view: two spring-coupled blocks (N is forced to 2 for this view)
// =========================================================================
let mode = 'pendulum';
const SPRING_Y = 220, BLOCK = 48, WALL_W = 14, WALL_MARGIN = 90, GAP = 160, DISP_AMP = 70;

function zigzag(x1, x2, y, coils, amp, color, lw){
  ctx.strokeStyle = color;
  ctx.lineWidth = lw;
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x1, y);
  const n = Math.max(1, Math.round(coils)) * 2;
  const dx = (x2 - x1) / n;
  for (let i = 1; i < n; i++){
    ctx.lineTo(x1 + dx * i, y + (i % 2 === 1 ? -amp : amp));
  }
  ctx.lineTo(x2, y);
  ctx.stroke();
}

function drawSprings(){
  ctx.clearRect(0, 0, W, H);

  const [r, psi] = meanField(TH);
  const centerX = W / 2;
  const leftWallX = WALL_MARGIN, rightWallX = W - WALL_MARGIN;
  const xA_eq = centerX - GAP, xB_eq = centerX + GAP;
  const xA = xA_eq + DISP_AMP * Math.cos(TH[0]);
  const xB = xB_eq + DISP_AMP * Math.cos(TH[1]);

  const kFrac = Math.min(1, K / 3);
  const bx = (xA + xB) / 2 - centerX; // actual midpoint of the two blocks, vs. fixed equilibrium

  // equilibrium ticks
  ctx.strokeStyle = axisCol;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(xA_eq, SPRING_Y - BLOCK/2 - 10); ctx.lineTo(xA_eq, SPRING_Y + BLOCK/2 + 10);
  ctx.moveTo(xB_eq, SPRING_Y - BLOCK/2 - 10); ctx.lineTo(xB_eq, SPRING_Y + BLOCK/2 + 10);
  ctx.stroke();

  // walls
  ctx.fillStyle = tickCol;
  ctx.fillRect(leftWallX - WALL_W, SPRING_Y - 70, WALL_W, 140);
  ctx.fillRect(rightWallX, SPRING_Y - 70, WALL_W, 140);

  // wall springs (fixed, always visible)
  zigzag(leftWallX, xA - BLOCK/2, SPRING_Y, 8, 10, beamCol, 3);
  zigzag(xB + BLOCK/2, rightWallX, SPRING_Y, 8, 10, beamCol, 3);

  // coupling spring: fades in and thickens as K rises from 0
  if (K > 0){
    const base = dark ? [207,212,220] : [43,52,66];
    const hot  = dark ? [242,106,106] : [206,44,43];
    const c = base.map((b, i) => Math.round(b + (hot[i] - b) * kFrac));
    ctx.globalAlpha = kFrac;
    zigzag(xA + BLOCK/2, xB - BLOCK/2, SPRING_Y, 5 + 5 * kFrac, 8 + 6 * kFrac,
      'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')', 2 + 3 * kFrac);
    ctx.globalAlpha = 1;
  }

  // equilibrium (orange) and displacement (blue) dots, on the coupling spring's line
  ctx.fillStyle = meanCol;
  ctx.beginPath();
  ctx.arc(centerX, SPRING_Y, 7, 0, 6.2832);
  ctx.fill();

  ctx.fillStyle = dispCol;
  ctx.beginPath();
  ctx.arc(centerX + bx, SPRING_Y, 7, 0, 6.2832);
  ctx.fill();

  // blocks
  ctx.fillStyle = bobCol;
  ctx.fillRect(xA - BLOCK/2, SPRING_Y - BLOCK/2, BLOCK, BLOCK);
  ctx.fillRect(xB - BLOCK/2, SPRING_Y - BLOCK/2, BLOCK, BLOCK);
  ctx.strokeStyle = rodCol;
  ctx.lineWidth = 3;
  ctx.strokeRect(xA - BLOCK/2, SPRING_Y - BLOCK/2, BLOCK, BLOCK);
  ctx.strokeRect(xB - BLOCK/2, SPRING_Y - BLOCK/2, BLOCK, BLOCK);

  const ir = 44, icx = W - 64, icy = H - 64;
  ctx.strokeStyle = axisCol;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(icx, icy, ir, 0, 6.2832);
  ctx.stroke();
  ctx.strokeStyle = meanCol;
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(icx, icy);
  ctx.lineTo(icx + ir * r * Math.cos(psi), icy - ir * r * Math.sin(psi));
  ctx.stroke();
  for (let j = 0; j < N; j++){
    ctx.fillStyle = rodCol;
    ctx.beginPath();
    ctx.arc(icx + ir * Math.cos(TH[j]), icy - ir * Math.sin(TH[j]), 4, 0, 6.2832);
    ctx.fill();
  }

  return r;
}

function setMode(m){
  if (mode === m) return;
  mode = m;
  document.getElementById('viewPend').classList.toggle('active', m === 'pendulum');
  document.getElementById('viewSpring').classList.toggle('active', m === 'spring');
  const nn = document.getElementById('nn');
  const nnRow = document.getElementById('nnRow');
  if (m === 'spring'){
    nn.dataset.savedN = N;
    N = 2;
    nn.value = 2;
    nn.disabled = true;
    nnRow.style.opacity = '0.5';
  } else {
    N = nn.dataset.savedN ? +nn.dataset.savedN : N;
    nn.value = N;
    nn.disabled = false;
    nnRow.style.opacity = '';
  }
  init();
  updateLabels();
}
document.getElementById('viewPend').addEventListener('click', () => setMode('pendulum'));
document.getElementById('viewSpring').addEventListener('click', () => setMode('spring'));

function step(){
  if (!paused){
    const sub = 2, dt = 0.016 * speed / sub;
    for (let s = 0; s < sub; s++) integrate(dt);
  }
  const r = mode === 'spring' ? drawSprings() : draw();
  document.getElementById('order').textContent = 'r = ' + r.toFixed(2);
  requestAnimationFrame(step);
}

function updateRegime(){
  const reg = document.getElementById('regime');
  if (K < 0.05) reg.textContent = 'Uncoupled: each pendulum keeps its own beat';
  else if (K > dOm) reg.textContent = 'Coupling beats the frequency spread: pendulums lock into a shared rhythm';
  else reg.textContent = 'Weak coupling: partial locking, phases drift past each other';
}
function updateLabels(){
  document.getElementById('nn-out').textContent = N;
  document.getElementById('kk-out').textContent = K.toFixed(2);
  document.getElementById('dw-out').textContent = dOm.toFixed(2);
  document.getElementById('spd-out').textContent = speed.toFixed(2).replace(/0$/, '') + '×';
  updateRegime();
}
document.getElementById('nn').addEventListener('input', e => {
  N = +e.target.value; init(); updateLabels();
});
document.getElementById('kk').addEventListener('input', e => {
  K = +e.target.value; updateLabels();
});
document.getElementById('dw').addEventListener('input', e => {
  dOm = +e.target.value; setFreqs(); updateLabels();
});
document.getElementById('spd').addEventListener('input', e => {
  speed = +e.target.value; updateLabels();
});
document.getElementById('reset').addEventListener('click', init);
document.getElementById('pause').addEventListener('click', e => {
  paused = !paused;
  e.currentTarget.textContent = paused ? 'Play' : 'Pause';
});

// =========================================================================
// Report content height to parent page (iframe.demo-embed auto-sizing)
// =========================================================================
function postHeight() {
  if (window.parent === window) return;
  const h = document.documentElement.scrollHeight;
  window.parent.postMessage({ type: 'demo-embed-height', height: h }, '*');
}
window.addEventListener('load', postHeight);
window.addEventListener('resize', postHeight);
if (window.ResizeObserver) new ResizeObserver(postHeight).observe(document.body);

init();
updateLabels();
requestAnimationFrame(step);
</script>

</body>
</html>
