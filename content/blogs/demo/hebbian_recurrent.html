<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hebbian learning without an output neuron</title>
<link rel="stylesheet" href="demo-shared.css">
<style>
  body { margin: 0; padding: 0; background: transparent; }
  canvas { display: block; width: 100%; }
</style>
</head>
<body>
<canvas id="cv" role="img"
  aria-label="Four fully connected neurons. Spike trains scroll in from the right, and each neuron lights up as its spike crosses a cyan line. Every connection between two neurons that fire together is strengthened, shown in green; a connection where one fires and the other is silent is weakened, shown in red. Neurons 1 and 2 fire together, as do neurons 3 and 4, so those two connections thicken while the four connections between the groups thin away."></canvas>
<script>
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const DPR = window.devicePixelRatio || 1;
let W = 640, H = 330;

// same palette as the single-neuron figure
const ON = '#FFA200', ON_EDGE = '#D98A00', OFF = '#FBDDB9', OFF_EDGE = '#DDB88A';
const EDGE = 'rgba(176,132,52,0.78)';
const UP = [46,170,98], DOWN = [214,72,72];     // strengthening green, weakening red
const INK = '#2b2a27', MUTED = '#8a857c', BASE = 'rgba(120,112,100,0.45)';

// ---- the model: four neurons, every pair connected, two groups that fire together ----
const N = 4, W0 = 0.6, ETA = 0.14, W_MAX = 2.0, W_MIN = 0.05;
const LTD = 0.5;    // one of the pair fires, the other is silent: weaken by this fraction of ETA
const P_GROUP = 0.13, P_ALONE = 0.03, BIN = 0.18;   // seconds per bin
const GROUP = [0, 0, 1, 1];
const PAIRS = []; for (let i = 0; i < N; i++) for (let j = i + 1; j < N; j++) PAIRS.push([i, j]);
let w, bins, flash, fsign, lit, holdT, fadeT, seen;
function reset(){
  w = PAIRS.map(() => W0); bins = [];
  flash = PAIRS.map(() => 0); fsign = PAIRS.map(() => 1);
  lit = new Array(N).fill(0); holdT = 0; fadeT = 0; seen = 0;
}
reset();

function stepBin(){
  const g = [Math.random() < P_GROUP, Math.random() < P_GROUP];
  const s = GROUP.map(k => g[k] ? Math.random() < 0.95 : Math.random() < P_ALONE);
  bins.push({ s, done: false });
  if (bins.length > 70) bins.shift();
}
// the moment a bin crosses the cyan line: every connection updates at once
function evaluate(b){
  const s = b.s; b.done = true;
  PAIRS.forEach(([i, j], e) => {
    if (!s[i] && !s[j]) return;                    // both silent: nothing to learn
    const together = s[i] && s[j];
    if (holdT === 0) w[e] = Math.max(W_MIN, w[e] + (together ? ETA : -LTD * ETA));
    flash[e] = 1; fsign[e] = together ? 1 : -1;
  });
  // a spike is green if some other neuron fired with it, red if it fired alone
  const k = s.filter(Boolean).length;
  b.d = s.map(on => on ? (k > 1 ? 1 : -1) : 0);
  for (let i = 0; i < N; i++) if (s[i]) lit[i] = 1;
  seen++;
  if (holdT === 0 && (Math.max(...w) >= W_MAX || seen > 150)) holdT = 1e-6;
}
function binX(k, scroll){ return RX1 - (bins.length - 1 - k) * BIN_PX - scroll * BIN_PX; }
function crossLine(scroll){
  for (let k = 0; k < bins.length; k++)
    if (!bins[k].done && binX(k, scroll) <= NOW_X) evaluate(bins[k]);
}
function prefill(){
  const m = Math.floor((RX1 - NOW_X) / BIN_PX);
  for (let k = 0; k < m; k++) stepBin();
}

// ---- layout: side by side when there is room, stacked on a phone ----
let POS, RX0, RX1, ROWS, NOW_X, narrow = null;
const R = 25, BIN_PX = 12;
function setLayout(){
  const n = (cv.parentElement.clientWidth || 640) < 480;
  if (n === narrow) return;
  narrow = n;
  if (!narrow) {
    W = 640; H = 330;
    POS = [[72, 78], [262, 78], [72, 258], [262, 258]];
    RX0 = 372; RX1 = 628; ROWS = [70, 140, 210, 280]; NOW_X = 490;
  } else {
    W = 360; H = 590;
    POS = [[86, 70], [274, 70], [86, 250], [274, 250]];
    RX0 = 52; RX1 = 350; ROWS = [370, 430, 490, 550]; NOW_X = 190;
  }
  cv.width = W * DPR; cv.height = H * DPR; ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (typeof postHeight === 'function') postHeight();
}
setLayout();
prefill();
window.addEventListener('resize', setLayout);

function node(x, y, r, on, label){
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,0.18)'; ctx.shadowBlur = 6; ctx.shadowOffsetY = 2;
  ctx.fillStyle = on > 0 ? mix(OFF, ON, on) : OFF;
  ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); ctx.restore();
  ctx.strokeStyle = on > 0.5 ? ON_EDGE : OFF_EDGE; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.stroke();
  sym(label, x, y + 6, 20);
}
function mix(a, b, t){
  const pa = [1,3,5].map(k => parseInt(a.substr(k,2),16)), pb = [1,3,5].map(k => parseInt(b.substr(k,2),16));
  return 'rgb(' + pa.map((v,k) => Math.round(v + (pb[k]-v)*t)).join(',') + ')';
}
// italic letter with a subscript, e.g. sym('w12', ...)
function sym(label, x, y, size, color, align){
  const base = label[0], sub = label.slice(1);
  ctx.fillStyle = color || INK;
  ctx.font = 'italic ' + size + 'px "Times New Roman", Times, serif';
  const bw = ctx.measureText(base).width;
  ctx.font = (size * 0.65) + 'px "Times New Roman", Times, serif';
  const sw = sub ? ctx.measureText(sub).width : 0;
  let x0 = align === 'right' ? x - bw - sw : align === 'left' ? x : x - (bw + sw) / 2;
  ctx.textAlign = 'left';
  ctx.font = 'italic ' + size + 'px "Times New Roman", Times, serif'; ctx.fillText(base, x0, y);
  if (sub) { ctx.font = (size * 0.65) + 'px "Times New Roman", Times, serif'; ctx.fillText(sub, x0 + bw, y + size * 0.25); }
}

// where each connection's label sits: sides at their midpoints, diagonals near the top
function labelPos(e){
  const [i, j] = PAIRS[e], [ax, ay] = POS[i], [bx, by] = POS[j];
  const cx = (POS[0][0] + POS[3][0]) / 2;
  if (ay === by) return [(ax + bx) / 2, ay + (ay < POS[2][1] ? -14 : 30)];      // top / bottom
  if (ax === bx) return [ax + (ax < cx ? -34 : 34), (ay + by) / 2 + 5];          // left / right
  const t = 0.27, x = ax + (bx - ax) * t, y = ay + (by - ay) * t;                // diagonals
  return [x + (bx > ax ? 22 : -22), y + 4];
}

function draw(scroll){
  ctx.clearRect(0, 0, W, H);
  ctx.globalAlpha = fadeT > 0 ? Math.max(0, 1 - fadeT) : 1;

  // --- network: all six connections ---
  ctx.lineCap = 'round';
  PAIRS.forEach(([i, j], e) => {
    const [ax, ay] = POS[i], [bx, by] = POS[j], L = Math.hypot(bx - ax, by - ay);
    const ux = (bx - ax) / L, uy = (by - ay) / L;
    const x0 = ax + ux * R, y0 = ay + uy * R, x1 = bx - ux * R, y1 = by - uy * R;
    const lw = 1.5 + 7 * Math.min(1, w[e] / W_MAX);
    ctx.strokeStyle = EDGE; ctx.lineWidth = lw;
    ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
    if (flash[e] > 0) {
      const c = fsign[e] > 0 ? UP : DOWN;
      ctx.strokeStyle = 'rgba(' + c.join(',') + ',' + (0.85 * flash[e]) + ')'; ctx.lineWidth = lw + 2;
      ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
    }
    const [lx, ly] = labelPos(e);
    sym('w' + (i + 1) + (j + 1), lx, ly, 17, MUTED);
  });
  for (let i = 0; i < N; i++) node(POS[i][0], POS[i][1], R, lit[i], 'x' + (i + 1));

  // --- spike trains ---
  ctx.strokeStyle = BASE; ctx.lineWidth = 1.2;
  ROWS.forEach(r => { ctx.beginPath(); ctx.moveTo(RX0, r); ctx.lineTo(RX1 + 4, r); ctx.stroke(); });
  for (let k = 0; k < bins.length; k++) {
    const b = bins[k], x = binX(k, scroll);
    if (x < RX0) continue;
    for (let i = 0; i < N; i++) {
      if (!b.s[i]) continue;
      const d = b.d ? b.d[i] : 0;   // once updated, a spike keeps the colour of its update
      ctx.strokeStyle = d > 0 ? 'rgb(' + UP.join(',') + ')' : d < 0 ? 'rgb(' + DOWN.join(',') + ')' : 'rgba(90,82,70,0.9)';
      ctx.lineWidth = d ? 2 : 1.6;
      const r = ROWS[i];
      ctx.beginPath(); ctx.moveTo(x - 3, r); ctx.lineTo(x, r - 26); ctx.lineTo(x + 3, r); ctx.stroke();
    }
  }
  const g = ctx.createLinearGradient(RX0, 0, RX0 + 30, 0);
  g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.globalCompositeOperation = 'destination-out'; ctx.fillStyle = g;
  ctx.fillRect(RX0 - 2, ROWS[0] - 36, 32, ROWS[3] - ROWS[0] + 46);
  ctx.globalCompositeOperation = 'source-over';
  for (let i = 0; i < N; i++) sym('x' + (i + 1), RX0 - 10, ROWS[i] + 6, 19, MUTED, 'right');
  ctx.strokeStyle = '#11B5D4'; ctx.lineWidth = 2.2;
  ctx.beginPath(); ctx.moveTo(NOW_X, ROWS[0] - 36); ctx.lineTo(NOW_X, ROWS[3] + 10); ctx.stroke();
  ctx.globalAlpha = 1;
}

// ---- loop ----
let last = performance.now(), acc = 0;
function frame(now){
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  acc += dt;
  while (acc >= BIN) { acc -= BIN; stepBin(); }
  crossLine(acc / BIN);
  for (let e = 0; e < PAIRS.length; e++) flash[e] = Math.max(0, flash[e] - dt * 2.2);
  for (let i = 0; i < N; i++) lit[i] = Math.max(0, lit[i] - dt * 3.0);
  if (holdT > 0) { holdT += dt; if (holdT > 3.0) fadeT += dt * 1.5; if (fadeT >= 1) { reset(); prefill(); } }
  draw(acc / BIN);
  requestAnimationFrame(frame);
}

if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
  for (let k = 0; k < 90 && holdT === 0; k++) { stepBin(); crossLine(0); }
  lit.fill(0); flash.fill(0); draw(0);
} else {
  requestAnimationFrame(frame);
}

function postHeight(){
  if (window.parent === window) return;
  // the canvas can be shorter than the iframe's 400px fallback, so measure the content
  window.parent.postMessage({type:'demo-embed-height', height: Math.ceil(document.body.getBoundingClientRect().height)}, '*');
}
window.addEventListener('load', postHeight);
window.addEventListener('resize', postHeight);
if (window.ResizeObserver) new ResizeObserver(postHeight).observe(document.body);

// --- Fluid type [FLUID-DEMO-v1] -------------------------------------------------
window.addEventListener('message', function (e) {
  var d = e.data;
  if (d && d.type === 'demo-embed-rootsize' && typeof d.size === 'number' && d.size > 0) {
    document.documentElement.style.fontSize = d.size + 'px';
    postHeight();
  }
});
if (window.parent !== window) {
  window.parent.postMessage({ type: 'demo-embed-ready' }, '*');
}
</script>
</body>
</html>
