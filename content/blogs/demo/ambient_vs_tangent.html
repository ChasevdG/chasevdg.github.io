<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ambient noise versus tangent noise — Interactive</title>
<link rel="stylesheet" href="demo-shared.css">
<style>
  :root {
    --bg: transparent; --panel: #ffffff; --border: rgba(0,0,0,0.12);
    --border-strong: rgba(0,0,0,0.25); --surface-1: #f5f4ee;
    --text: #1a1a18; --muted: #5f5e5a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1a18; --panel: #262624; --border: rgba(255,255,255,0.14);
      --border-strong: rgba(255,255,255,0.3); --surface-1: #262624;
      --text: #f0efea; --muted: #b4b2a9;
    }
  }
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 1rem 1.25rem;
         background: var(--bg); color: var(--text); }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 0.5rem; padding: 0.875rem; }
  .controls { margin-bottom: 0.875rem; }
  .row { display: grid; grid-template-columns: 8.5rem 1fr 4.5rem; gap: 0.625rem; align-items: center; margin-bottom: 0.5rem; }
  .row label { font-size: 0.8125rem; }
  .row .val { font-size: 0.75rem; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
  input[type="range"] { width: 100%; accent-color: #F5A800; }
  .modes { display: flex; gap: 0.5rem; margin-bottom: 0.625rem; flex-wrap: wrap; align-items: center; }
  .modes .sep { width: 1px; height: 1.25rem; background: var(--border-strong); margin: 0 0.25rem; }
  .modes span.lbl { font-size: 0.75rem; color: var(--muted); }
  .modes button { font-size: 0.75rem; padding: 0.3125rem 0.6875rem; border: 1px solid var(--border-strong);
                  border-radius: 0.25rem; background: transparent; color: var(--text); cursor: pointer; }
  .modes button:hover { background: var(--surface-1); }
  .modes button.active { background: rgba(255,140,0,0.16); border-color: #cc7000; font-weight: 600; }
  .statusbar { display: flex; align-items: baseline; gap: 0.75rem; font-size: 0.75rem; color: var(--muted); margin-top: 0.25rem; }
  .statusbar button { margin-left: auto; font-size: 0.75rem; padding: 0.25rem 0.75rem; border: 1px solid var(--border-strong);
                      border-radius: 0.25rem; background: transparent; color: var(--text); cursor: pointer; }
  .statusbar button:hover { background: var(--surface-1); }
  .canvas-wrap { border: 1px solid var(--border); border-radius: 0.5rem; overflow: hidden; background: var(--panel); }
  canvas { display: block; width: 100%; }
</style>
</head>
<body>

<h1>Noise in the ambient space vs the tangent space</h1>
<div class="panel">
  <div class="controls">
    <div class="modes">
      <span class="lbl">noise in&nbsp;</span>
      <button id="m-amb" class="active">ambient space</button>
      <button id="m-tan">tangent space</button>
      <span class="sep"></span>
      <span class="lbl">embedded in&nbsp;</span>
      <button id="d-2" class="active">&#8477;&sup2;</button>
      <button id="d-3">&#8477;&sup3;</button>
    </div>
    <div class="row">
      <label for="sig">noise &sigma;</label>
      <input type="range" id="sig" min="0.02" max="0.40" step="0.005" value="0.13">
      <span class="val" id="sig-out">0.130</span>
    </div>
    <div class="row">
      <label for="nn">data points N</label>
      <input type="range" id="nn" min="3" max="16" step="1" value="8">
      <span class="val" id="nn-out">8</span>
    </div>
    <div class="row">
      <label for="mm">samples each M</label>
      <input type="range" id="mm" min="10" max="300" step="10" value="150">
      <span class="val" id="mm-out">150</span>
    </div>
    <div class="statusbar">
      <span id="verdict">&nbsp;</span>
      <button id="pause">Pause</button>
    </div>
  </div>
  <div class="canvas-wrap"><canvas id="cv"></canvas></div>
</div>

<script>
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const W = 900, H = 560, DPR = window.devicePixelRatio || 1;
cv.width = W * DPR; cv.height = H * DPR; ctx.scale(DPR, DPR);

const mq = window.matchMedia('(prefers-color-scheme: dark)');
let circleCol, textCol, axisCol, light;
function setColors(){
  const d = mq.matches;
  light      = d ? 62 : 46;                       // lightness for the per-point hues
  circleCol  = d ? 'rgba(240,239,234,0.55)' : 'rgba(26,26,24,0.45)';
  axisCol    = d ? 'rgba(160,160,155,0.22)' : 'rgba(95,94,90,0.18)';
  textCol    = d ? 'rgba(240,239,234,0.88)' : 'rgba(26,26,24,0.82)';
}
setColors();
if (mq.addEventListener) mq.addEventListener('change', () => { setColors(); rebuild(); });

// ---- state ----------------------------------------------------------------
let mode = 'amb', dim = 2, sigma = 0.13, N = 8, M = 150, paused = false, spin = 0;
function gauss(){ let u=0,v=0; while(!u) u=Math.random(); while(!v) v=Math.random();
  return Math.sqrt(-2*Math.log(u))*Math.cos(6.283185307*v); }

// Fixed standard normals, so moving a slider re-scales the same cloud instead of
// reshuffling it -- the change you see is the change you made.
let noise = [];
function rebuild(){
  noise = [];
  for (let i=0;i<N;i++){
    const row = [];
    for (let j=0;j<M;j++) row.push([gauss(), gauss(), gauss()]);
    noise.push(row);
  }
}
rebuild();
const hue = i => 360*i/N;

// ---- projection -----------------------------------------------------------
const CX = 450, CY = 292, R = 196;
const TILT0 = -0.82, SPIN0 = 0;   // the view drag resets to
let tilt = TILT0;
function project(p){
  // spin about the circle's own axis (z), then tilt the whole thing toward the viewer
  const c = Math.cos(spin), s = Math.sin(spin);
  const x =  c*p[0] - s*p[1];
  const y =  s*p[0] + c*p[1];
  const z =  p[2];
  const ct = Math.cos(tilt), st = Math.sin(tilt);
  const yy = ct*y - st*z;
  const zz = st*y + ct*z;
  return [CX + x*R, CY - yy*R, zz];        // z kept for depth ordering
}
function flat(p){ return [CX + p[0]*R, CY - p[1]*R, 0]; }
const toScreen = p => (dim === 3 ? project(p) : flat(p));

// ---- drawing ---------------------------------------------------------------
function drawCircle(){
  ctx.strokeStyle = circleCol; ctx.lineWidth = 2;
  ctx.setLineDash([1.5, 7]); ctx.lineCap = 'round';
  ctx.beginPath();
  for (let k=0;k<=240;k++){
    const t = 6.283185307*k/240;
    const q = toScreen([Math.cos(t), Math.sin(t), 0]);
    k ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1]);
  }
  ctx.closePath(); ctx.stroke();
  ctx.setLineDash([]); ctx.lineCap = 'butt';
}

function draw(){
  ctx.clearRect(0,0,W,H);

  if (dim === 3){
    // a faint axis out of the plane, so "off the manifold" has somewhere to point
    ctx.strokeStyle = axisCol; ctx.lineWidth = 1.5; ctx.setLineDash([4,5]);
    const a = toScreen([0,0,-1.15]), b = toScreen([0,0,1.15]);
    ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.stroke();
    ctx.setLineDash([]);
  }
  drawCircle();

  // every noised sample, collected first so 3D can be drawn back to front
  const pts = [];
  for (let i=0;i<N;i++){
    const t = 6.283185307*i/N;
    const bx = Math.cos(t), by = Math.sin(t);
    for (let j=0;j<M;j++){
      const e = noise[i][j];
      let p;
      if (mode === 'amb'){
        // isotropic in the ambient space: in R^3 it also leaves the plane of the circle
        p = [bx + sigma*e[0], by + sigma*e[1], dim === 3 ? sigma*e[2] : 0];
      } else {
        // along the manifold only, whatever the ambient dimension
        const tt = t + sigma*e[0];
        p = [Math.cos(tt), Math.sin(tt), 0];
      }
      const q = toScreen(p);
      pts.push([q[0], q[1], q[2], i]);
    }
  }
  if (dim === 3) pts.sort((a,b) => a[2] - b[2]);
  for (const [x,y,z,i] of pts){
    // depth cue: nearer samples are bigger and more opaque. Without this the R^3
    // view is indistinguishable from R^2 when the rotation is paused, since an
    // isotropic 3D gaussian projects to an isotropic 2D one.
    const dz = dim === 3 ? Math.max(-1, Math.min(1, z/1.15)) : 0;
    const rad = 2.6 * (1 + 0.42*dz);
    const alp = 0.16 * (1 + 0.55*dz);
    ctx.fillStyle = 'hsla(' + hue(i).toFixed(0) + ', 72%, ' + light + '%, ' + alp.toFixed(3) + ')';
    ctx.beginPath(); ctx.arc(x, y, rad, 0, 6.2832); ctx.fill();
  }

  // the data points themselves, on top
  const base = [];
  for (let i=0;i<N;i++){
    const t = 6.283185307*i/N;
    const q = toScreen([Math.cos(t), Math.sin(t), 0]);
    base.push([q[0], q[1], q[2], i]);
  }
  if (dim === 3) base.sort((a,b) => a[2] - b[2]);
  for (const [x,y,z,i] of base){
    const dz = dim === 3 ? Math.max(-1, Math.min(1, z/1.15)) : 0;
    ctx.fillStyle = 'hsl(' + hue(i).toFixed(0) + ', 72%, ' + light + '%)';
    ctx.beginPath(); ctx.arc(x, y, 5*(1 + 0.30*dz), 0, 6.2832); ctx.fill();
    ctx.strokeStyle = mq.matches ? 'rgba(26,26,24,0.7)' : 'rgba(255,255,255,0.85)';
    ctx.lineWidth = 1.4; ctx.stroke();
  }

  ctx.fillStyle = textCol; ctx.font = '600 0.8125rem system-ui, sans-serif'; ctx.textAlign = 'left';
  ctx.fillText('a circle of data, embedded in ' + (dim === 2 ? 'ℝ²' : 'ℝ³') +
               ', noised in the ' + (mode === 'amb' ? 'ambient' : 'tangent') + ' space', 16, 26);
  if (dim === 3){
    ctx.font = '0.6875rem system-ui, sans-serif'; ctx.globalAlpha = 0.6; ctx.textAlign = 'right';
    ctx.fillText('drag to orbit · double-click to reset the view', W - 16, 26);
    ctx.globalAlpha = 1; ctx.textAlign = 'left';
  }

  document.getElementById('verdict').innerHTML = mode === 'amb'
    ? 'each cloud is a ball around its data point — most of it lies <strong>off</strong> the dotted circle' +
      (dim === 3 ? ', including out of its plane entirely' : '')
    : 'each cloud is an arc <strong>on</strong> the dotted circle — no sample ever leaves the data manifold';
}

// ---- controls --------------------------------------------------------------
function bind(id, fn, fmt){
  const el = document.getElementById(id), out = document.getElementById(id+'-out');
  el.addEventListener('input', e => { fn(+e.target.value); out.textContent = fmt(+e.target.value); });
  out.textContent = fmt(+el.value);
}
bind('sig', v => { sigma = v; }, v => v.toFixed(3));
bind('nn',  v => { N = v; rebuild(); }, v => String(v));
bind('mm',  v => { M = v; rebuild(); }, v => String(v));
function group(map, set){
  Object.keys(map).forEach(k => document.getElementById(map[k]).addEventListener('click', () => {
    set(k);
    Object.keys(map).forEach(j => document.getElementById(map[j]).classList.toggle('active', j === k));
  }));
}
group({ amb:'m-amb', tan:'m-tan' }, k => { mode = k; });
group({ 2:'d-2', 3:'d-3' }, k => { dim = +k; setCursor(); });
document.getElementById('pause').addEventListener('click', e => {
  paused = !paused; e.currentTarget.textContent = paused ? 'Play' : 'Pause';
});

// ---- orbit -----------------------------------------------------------------
let dragging = false, lastX = 0, lastY = 0;
const pauseBtn = document.getElementById('pause');
function setCursor(){
  cv.style.cursor = dim === 3 ? (dragging ? 'grabbing' : 'grab') : 'default';
  // only swallow touch gestures where they mean something; in 2D a phone must
  // still be able to scroll the page by dragging over the canvas
  cv.style.touchAction = dim === 3 ? 'none' : 'auto';
}
setCursor();

cv.addEventListener('pointerdown', e => {
  if (dim !== 3) return;
  dragging = true; lastX = e.clientX; lastY = e.clientY;
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
  // taking hold of the camera stops the idle spin; Play starts it again
  paused = true; pauseBtn.textContent = 'Play';
  setCursor(); e.preventDefault();
});
cv.addEventListener('pointermove', e => {
  if (!dragging) return;
  const dx = e.clientX - lastX, dy = e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
  spin += dx * 0.008;
  tilt = Math.max(-1.45, Math.min(1.45, tilt + dy * 0.008));   // clamped short of flipping over
  e.preventDefault();
});
function endDrag(e){
  if (!dragging) return;
  dragging = false;
  try { cv.releasePointerCapture(e.pointerId); } catch (err) {}
  setCursor();
}
cv.addEventListener('pointerup', endDrag);
cv.addEventListener('pointercancel', endDrag);
cv.addEventListener('dblclick', e => {
  if (dim !== 3) return;
  tilt = TILT0; spin = SPIN0; e.preventDefault();
});

function loop(){
  if (!paused && dim === 3 && !dragging) spin += 0.004;
  draw();
  requestAnimationFrame(loop);
}

function postHeight() {
  if (window.parent === window) return;
  window.parent.postMessage({ type: 'demo-embed-height', height: document.documentElement.scrollHeight }, '*');
}
window.addEventListener('load', postHeight);
window.addEventListener('resize', postHeight);
if (window.ResizeObserver) new ResizeObserver(postHeight).observe(document.body);

// --- Fluid type [FLUID-DEMO-v1] -------------------------------------------
window.addEventListener('message', function (e) {
  var d = e.data;
  if (d && d.type === 'demo-embed-rootsize' && typeof d.size === 'number' && d.size > 0) {
    document.documentElement.style.fontSize = d.size + 'px';
    if (typeof fit === 'function') { try { fit(); } catch (err) {} }
    postHeight();
  }
});
if (window.parent !== window) {
  window.parent.postMessage({ type: 'demo-embed-ready' }, '*');
}

requestAnimationFrame(loop);
</script>

</body>
</html>
